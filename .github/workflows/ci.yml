# Runs every check against a fresh local Supabase stack.  Then, only from
# main and only if the checks passed, applies new migrations to the hosted
# database and deploys the frontend to Cloudflare Pages.  Pages' own automatic
# deploys are turned off (Branch control), so this is the only way code
# reaches production.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR supersedes the run in progress.  Runs on main are never
# cancelled, so a deploy can't be cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Applies the migrations and seed to a fresh database.  The app doesn't
      # use these services, so skipping them saves image pulls.
      - run: npx supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,mailpit
      - run: npm run check

  # Applies new migrations to the hosted database, as its own job so it shows
  # up on its own in the run and a failed deploy can be re-run without it.
  # It runs before deploy, so the new frontend never calls tables or
  # functions that aren't there yet.  The old frontend stays live meanwhile
  # (and if the deploy fails), so every migration has to work with it too.
  #
  # GitHub's runners have no IPv6 and the database's direct host is
  # IPv6-only, so the CLI looks up the IPv4 pooler.  The token needs Database
  # read-write (for the CLI's temporary login role) and Connection Pooling
  # read.
  migrate:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      # For the Supabase CLI, pinned in package.json.
      - run: npm ci
      - name: Apply new migrations to the hosted database
        run: make db-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  # Only runs once the migrations are in.  If migrate fails, nothing is
  # deployed.
  deploy:
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Builds with the hosted values, refuses a build that points at the local
      # stack or uses Turnstile's test key, then uploads dist/.
      - run: make deploy-web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
